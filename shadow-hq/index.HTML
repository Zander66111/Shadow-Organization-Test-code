<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shadow Organization HQ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{background:#050505;color:#ff1a1a;font-family:Courier New;margin:0;text-align:center}
header{background:black;border-bottom:2px solid red;padding:15px}
#logo{width:140px}
button,input{background:black;color:#ff1a1a;border:1px solid red;padding:6px;margin:4px}
.section{display:none;padding:20px}
.tab{display:inline-block;border:1px solid red;padding:8px;margin:4px;cursor:pointer}
#panel{display:none}
#terminalBox{height:220px;overflow:auto;border:1px solid red;padding:10px}
#map{height:420px;margin-top:10px}
</style>
</head>

<body>

<header>
<h1>Shadow Organization HQ</h1>
<div id="clock"></div>
</header>

<div id="login">

<h2>Secure Access Portal</h2>

<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>

<button onclick="login()">Enter HQ</button>

<p id="msg"></p>

</div>

<div id="panel">

<h2 id="welcome"></h2>

<div>

<div class="tab" onclick="openTab('dashboard')">Dashboard</div>
<div class="tab" onclick="openTab('missions')">Missions</div>
<div class="tab" onclick="openTab('agents')">Agents</div>
<div class="tab" onclick="openTab('terminal')">Terminal</div>
<div class="tab" onclick="openTab('mapTab')">Satellite</div>
<div class="tab" onclick="openTab('ranks')">Ranks</div>
<div class="tab" onclick="openTab('admin')">Admin</div>

</div>

<div id="dashboard" class="section">
<h3>Organization Status</h3>
<div id="status"></div>
</div>

<div id="missions" class="section">

<h3>Mission Board</h3>

<ul id="missionList"></ul>

<input id="missionName" placeholder="Mission name">
<input id="missionLoc" placeholder="Location">

<button onclick="createMission()">Create Mission</button>

</div>

<div id="agents" class="section">

<h3>Agent Database</h3>
<ul id="agentList"></ul>

</div>

<div id="terminal" class="section">

<h3>Shadow Terminal</h3>

<div id="terminalBox"></div>

<input id="cmd" placeholder="command">
<button onclick="command()">execute</button>

</div>

<div id="mapTab" class="section">

<h3>Satellite Operations Map</h3>

<div id="map"></div>

</div>

<div id="ranks" class="section">

<h3>Rank Hierarchy</h3>

<ul id="rankList"></ul>

</div>

<div id="admin" class="section">

<h3>Admin Control</h3>

<input id="newUser" placeholder="new agent">
<input id="newPass" placeholder="password">

<button onclick="addAgent()">Create Agent</button>

</div>

</div>

<script>

/* CORE DATA /

let ranks=[
"Shadow Initiate","Veil Walker","Silent Trace","Night Watcher",
"Shade Operative","Shadow Agent","Phantom Agent","Umbra Hunter",
"Void Tracker","Dusk Operative","Phantom Blade","Night Phantom",
"Umbra Enforcer","Void Stalker","Shadow Reaper","Umbra Commander",
"Void Overseer","Phantom Architect","Shadow Warden","Umbra Highlord",
"Dread Umbra","Veil Sovereign","Night Regent","Void Sovereign",
"Umbra Prime","Shadow Umbra"
]

let users={
"Shadow Umbra":{password:"Shadow Umbra",rank:25,role:"owner"},
"Agent1":{password:"Agent01",rank:1,role:"member"}
}

let missions=[
{name:"Operation Nightfall",location:"Arctic Base"},
{name:"Silent Dagger",location:"Pacific Hub"}
]

let currentUser=""
let credits=1000
let globalThreat="LOW"

/ LOGIN /

function login(){

let u=user.value.trim()
let p=pass.value.trim()

if(users[u] && users[u].password===p){

currentUser=u

login.style.display="none"
panel.style.display="block"

welcome.innerHTML="Welcome "+u+" | Rank: "+ranks[users[u].rank]

loadAgents()
loadRanks()
renderMissions()
updateStatus()
initMap()

openTab("dashboard")

}else{

msg.innerHTML="ACCESS DENIED"

}

}

/ TABS /

function openTab(id){

document.querySelectorAll(".section").forEach(s=>s.style.display="none")
document.getElementById(id).style.display="block"

}

/ STATUS /

function updateStatus(){

status.innerHTML=
"Agents: "+Object.keys(users).length+
"<br>Missions: "+missions.length+
"<br>Credits: "+credits+
"<br>Threat Level: "+globalThreat

}

/ AGENTS /

function loadAgents(){

agentList.innerHTML=""

for(let a in users){

let li=document.createElement("li")
li.innerHTML=a+" | "+ranks[users[a].rank]
agentList.appendChild(li)

}

}

function addAgent(){

let u=newUser.value
let p=newPass.value

if(!u||!p)return

users[u]={password:p,rank:0,role:"member"}

loadAgents()
updateStatus()

}

/ RANKS /

function loadRanks(){

rankList.innerHTML=""

for(let i=ranks.length-1;i>=0;i--){

let li=document.createElement("li")
li.innerHTML=(i+1)+" "+ranks[i]
rankList.appendChild(li)

}

}

/ MISSIONS /

function renderMissions(){

missionList.innerHTML=""

missions.forEach((m,i)=>{

let li=document.createElement("li")

li.innerHTML=
m.name+" - "+m.location+
" <button onclick='acceptMission("+i+")'>Accept</button>"

missionList.appendChild(li)

})

}

function createMission(){

let name=missionName.value
let loc=missionLoc.value

if(!name||!loc)return

missions.push({name:name,location:loc})

renderMissions()
updateStatus()

}

function acceptMission(i){

alert("Mission accepted: "+missions[i].name)

credits+=100

updateStatus()

}

/ TERMINAL /

function command(){

let c=cmd.value.toLowerCase()

terminalBox.innerHTML+="<br>> "+c

if(c==="help")
terminalBox.innerHTML+="<br>help agents missions ranks time date scan credits threat radar"

if(c==="agents")
for(let a in users) terminalBox.innerHTML+="<br>"+a

if(c==="missions")
missions.forEach(m=>terminalBox.innerHTML+="<br>"+m.name)

if(c==="credits")
terminalBox.innerHTML+="<br>"+credits

if(c==="scan")
terminalBox.innerHTML+="<br>Satellite sweep complete"

if(c==="radar")
startRadar()

}

/ MAP /

function initMap(){

let map=L.map('map').setView([20,0],2)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map)

L.marker([78,-20]).addTo(map).bindPopup("Arctic Base")
L.marker([-15,120]).addTo(map).bindPopup("Pacific Hub")

}

/ RADAR /

function startRadar(){

let r=document.createElement("div")

r.style.position="fixed"
r.style.bottom="20px"
r.style.left="20px"
r.style.width="120px"
r.style.height="120px"
r.style.border="2px solid red"
r.style.borderRadius="50%"
r.style.animation="spin 4s linear infinite"

document.body.appendChild(r)

}

let style=document.createElement("style")
style.innerHTML="@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}"
document.head.appendChild(style)

/ THREAT SYSTEM */

setInterval(()=>{

let levels=["LOW","GUARDED","ELEVATED","HIGH","CRITICAL"]

globalThreat=levels[Math.floor(Math.random()5)]

updateStatus()

},15000)

/ CLOCK */

setInterval(()=>{

clock.innerHTML=new Date().toLocaleString()

},1000)

</script>
<script>

/* ============================= /
/ SHADOW HQ EXTENSION PACK 4 /
/ ============================= /

/ -------- ADD 40 NEW RANKS -------- /

let extraRanks=[
"Whisper Initiate",
"Shade Listener",
"Dark Observer",
"Veil Initiate",
"Phantom Listener",
"Night Archivist",
"Umbra Scout",
"Silent Warden",
"Shadow Seeker",
"Void Listener",
"Phantom Seer",
"Dark Analyst",
"Night Strategist",
"Shadow Architect",
"Umbra Strategist",
"Phantom Overseer",
"Void Overseer Prime",
"Shadow Executioner",
"Umbra Executioner",
"Night Sovereign",
"Void Sovereign Prime",
"Shadow Dominus",
"Umbra Dominus",
"Night Dominus",
"Shadow Ascendant",
"Void Ascendant",
"Umbra Ascendant",
"Shadow Regent",
"Umbra Regent",
"Night Regent Prime",
"Void Regent",
"Shadow Eternal",
"Umbra Eternal",
"Void Eternal",
"Shadow Paragon",
"Umbra Paragon",
"Night Paragon",
"Void Paragon",
"Shadow Apex",
"Umbra Apex"
]

extraRanks.forEach(r=>{
if(!ranks.includes(r)) ranks.unshift(r)
})

/ -------- SHADOW CREDITS SYSTEM -------- /

let shadowCredits=500

function giveCredits(amount){

shadowCredits+=amount

if(typeof updateStatus==="function") updateStatus()

}

/ -------- AGENT PROFILE SYSTEM -------- /

function viewAgentProfile(name){

if(!users[name]) return

let info=users[name]

alert(
"AGENT PROFILE\n\n"+
"Name: "+name+"\n"+
"Rank: "+ranks[info.rank]+"\n"+
"Role: "+info.role+"\n"+
"Shadow Credits: "+shadowCredits
)

}

/ -------- IMPROVED MISSION UI -------- /

function acceptMissionExtended(index){

if(!missions[index]) return

alert("Mission accepted: "+missions[index].name)

giveCredits(150)

if(users[currentUser].rank < ranks.length-1){
users[currentUser].rank++
}

if(typeof loadRanks==="function") loadRanks()

}

function declineMission(index){

alert("Mission declined.")

}

/ -------- INTEL VAULT -------- /

let intelFiles=[
"FILE-01 : Arctic Listening Station",
"FILE-02 : Deep Pacific Signal Array",
"FILE-03 : Shadow Satellite Relay",
"FILE-04 : Veil Surveillance Grid",
"FILE-05 : Umbra Global Network"
]

function openIntelVault(){

let text="CLASSIFIED INTEL VAULT\n\n"

intelFiles.forEach(f=>{
text+=f+"\n"
})

alert(text)

}

/ -------- FACTION INFLUENCE TRACKER -------- /

let globalInfluence=12

function increaseInfluence(){

globalInfluence++

console.log("Faction Influence:",globalInfluence)

}

/ -------- AI COMMANDER RESPONSES -------- /

function commanderAI(question){

let q=question.toLowerCase()

if(q.includes("mission")) return "Commander: Missions available in operations tab."

if(q.includes("rank")) return "Commander: Continue completing operations to ascend."

if(q.includes("shadow")) return "Commander: The shadows are always watching."

if(q.includes("help")) return "Commander: Use terminal command 'help' to view systems."

return "Commander: Processing request..."

}

/ -------- ADD TERMINAL COMMANDS -------- /

let oldCommand=command

command=function(){

let c=cmd.value.toLowerCase()

if(c==="credits"){
terminalBox.innerHTML+="<br>Shadow Credits: "+shadowCredits
return
}

if(c==="intel"){
terminalBox.innerHTML+="<br>Opening Intel Vault..."
openIntelVault()
return
}

if(c==="influence"){
terminalBox.innerHTML+="<br>Faction Influence: "+globalInfluence
return
}

if(c.startsWith("profile")){

let parts=c.split(" ")

if(parts[1]) viewAgentProfile(parts[1])

return
}

if(c.startsWith("commander")){

let q=c.replace("commander","")

terminalBox.innerHTML+="<br>"+commanderAI(q)

return
}

/ run original command /

oldCommand()

}

/ -------- RANDOM FACTION EVENTS -------- */

setInterval(()=>{

let events=[
"Shadow network expanded.",
"New surveillance node online.",
"Foreign signals intercepted.",
"Shadow agents deployed globally."
]

let e=events[Math.floor(Math.random()*events.length)]

console.log("Shadow Event:",e)

increaseInfluence()

},20000)

</script>

</body>
</html>
